name: Website Content Sync

on:
  push:
    branches:
      - main
    paths:
      - "project-meta/**"
      - "releases/**"
      - "scripts/generate-website-content.ts"
      - "website/src/content/generated/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate website content
        run: npm run website:sync

      - name: Commit synced content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(website): sync generated product content"
          file_pattern: website/src/content/generated/**
