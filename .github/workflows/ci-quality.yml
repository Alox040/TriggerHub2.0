name: quality-gate

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build
