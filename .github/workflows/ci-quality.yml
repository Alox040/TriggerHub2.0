name: quality-gate

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:

  quality-check:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test --if-present


  build-core:
    name: Build Core
    runs-on: ubuntu-latest
    needs: quality-check

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present


  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    needs: quality-check

    defaults:
      run:
        working-directory: website

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present
