name: Context Sync

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  sync-context:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Root-Abhängigkeiten installieren
        run: npm ci

      - name: Website-Abhängigkeiten installieren
        run: |
          if [ -f website/package.json ]; then
            npm --prefix website ci
          fi

      - name: Kontextdateien aktualisieren
        run: npm run context:sync

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore(context): auto-update AI context files"

      - name: Änderungen pushen
        run: |
          git push
