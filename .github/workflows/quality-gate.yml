name: Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run root typecheck
        run: npm run typecheck

  test:
    name: Tests (all, incl. website security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  dependency-audit:
    name: Dependency audit (root + website)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit website production dependencies
        run: npm --prefix website audit --omit=dev --audit-level=high

  website-check:
    name: Website typecheck and build
    runs-on: ubuntu-latest
    env:
      # Policy config values required by the prebuild security guard — not secrets, not embedded as sensitive data
      VITE_ACCESS_MODE: private_prelaunch
      VITE_ENABLE_SIGNUP: "false"
      # VITE_SESSION_TTL_MS is embedded in the bundle as a non-sensitive config value
      VITE_SESSION_TTL_MS: "3600000"
      # Server-side only env vars (non-VITE_ prefix — Vite does not embed these in the client bundle).
      # Dummy CI placeholder values; the prebuild guard checks presence/format, not real credentials.
      OWNER_LOGIN_USERNAME: ci-placeholder
      OWNER_LOGIN_PASSWORD_HASH: ci-placeholder-hash
      OWNER_LOGIN_PASSWORD_SALT: ci-placeholder-salt
      OWNER_LOGIN_PASSWORD_ITERATIONS: "1"
      OWNER_USER_ID: ci-placeholder-id
      OWNER_EMAIL: ci@placeholder.local
      PRELAUNCH_SESSION_SECRET: ci-placeholder-session-secret
      PRELAUNCH_ACCESS_KEY: ci-placeholder-access-key
      PRELAUNCH_GATE_TTL_MS: "86400000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Typecheck website
        # Uses root tsc binary explicitly — website has no typescript devDependency of its own
        run: ./node_modules/.bin/tsc --noEmit --project website/tsconfig.json

      - name: Build website (includes prebuild security guard)
        run: npm --prefix website run build

  build-smoke:
    name: Build smoke (root Vite)
    runs-on: ubuntu-latest
    needs: [typecheck, test, dependency-audit, website-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Vite build smoke test
        run: npm run build

  summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [typecheck, test, dependency-audit, website-check, build-smoke]
    if: always()
    steps:
      - name: Evaluate quality gate result
        shell: bash
        run: |
          FAILED=0

          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "::error::BLOCKING: typecheck result=${{ needs.typecheck.result }}"
            FAILED=1
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::BLOCKING: tests result=${{ needs.test.result }}"
            FAILED=1
          fi

          if [[ "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "::error::BLOCKING: dependency-audit result=${{ needs.dependency-audit.result }}"
            FAILED=1
          fi

          if [[ "${{ needs.website-check.result }}" != "success" ]]; then
            echo "::error::BLOCKING: website-check result=${{ needs.website-check.result }}"
            FAILED=1
          fi

          if [[ "${{ needs.build-smoke.result }}" != "success" ]]; then
            echo "::error::BLOCKING: build-smoke result=${{ needs.build-smoke.result }}"
            FAILED=1
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            echo "Quality gate FAILED. Merge is blocked."
            exit 1
          fi

          echo "Quality gate PASSED. All blocking checks succeeded."
