name: Desktop Build (CI)

# Produces a desktop build artifact on push to main.
# Quality checks (typecheck, tests, website build) are handled by quality-gate.yml.
# Full release packaging is handled by release.yml.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  desktop-build:
    name: Build Desktop Artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run desktop:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-desktop-artifacts
          path: |
            dist/**
            release/**
          if-no-files-found: error
