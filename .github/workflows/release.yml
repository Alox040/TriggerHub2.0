name: Release Pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Run root typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit website production dependencies
        run: npm --prefix website audit --omit=dev --audit-level=high

      - name: Typecheck website
        run: ./node_modules/.bin/tsc --noEmit --project website/tsconfig.json

      - name: Build website
        run: npm --prefix website run build

      - name: Sync website content
        run: npm run website:sync

      - name: Validate release pipeline
        run: npm run release:validate

      - name: Commit synced release metadata
        if: github.ref_type == 'branch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "release: sync generated website content and metadata"
          file_pattern: |
            website/src/content/generated/**
            releases/**
            project-meta/status/release-status.json

      - name: Enforce no-write policy for non-branch contexts
        if: github.ref_type != 'branch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Release workflow runs in no-write mode for ref type '${{ github.ref_type }}'."
            echo "::error::Generated release metadata/content is dirty in this context. Sync and commit on a branch before creating a release tag."
            git status --short
            exit 1
          fi
          echo "No-write policy confirmed for ref type '${{ github.ref_type }}': repository state is clean."

      - name: Upload release context
        uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: |
            project-context/security-reports/**
            agents/project-context/**
            PROJECT_AGENT_SYSTEM_SNAPSHOT.md
          if-no-files-found: warn

  validate_connected_clients:
    name: Validate Connected Client Apps
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Detect and validate additional client apps
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_DIRS=(mobile web-client client apps/mobile apps/web-client)
          FOUND=0

          for DIR in "${CLIENT_DIRS[@]}"; do
            if [[ ! -d "$DIR" || ! -f "$DIR/package.json" ]]; then
              continue
            fi

            FOUND=1
            echo "Validating connected client app: $DIR"
            npm --prefix "$DIR" ci

            if node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.exit(p.scripts && p.scripts.build ? 0 : 1)" "$DIR/package.json"; then
              npm --prefix "$DIR" run build
            else
              echo "::error::Connected client app '$DIR' is missing a build script and cannot be included in release validation."
              exit 1
            fi
          done

          if [[ "$FOUND" -eq 0 ]]; then
            echo "No additional connected client apps found (mobile/web client directories)."
          fi

  build_desktop:
    name: Build Desktop Artifacts
    runs-on: windows-latest
    needs:
      - validate
      - validate_connected_clients
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build desktop release
        run: npm run desktop:release

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: |
            dist/Setup.exe
            dist/App.exe
            dist/Uninstall.exe
            dist/latest.yml
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_desktop
      - validate_connected_clients
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: release-assets

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.yml
            release-assets/**/*.blockmap

  deploy_website:
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest
    needs: publish_release
    if: env.VERCEL_DEPLOY_HOOK_URL != ''
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Vercel deployment
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
