name: reusable-agent-validation

on:
  workflow_call:
    inputs:
      agents_root:
        required: false
        type: string
        default: agents

permissions:
  contents: read

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest files exist and are non-empty
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          root = pathlib.Path("${{ inputs.agents_root }}")
          manifest = json.loads((root / "MANIFEST.json").read_text(encoding="utf-8"))
          missing = []
          empty = []
          for rel in manifest["files"]:
              path = pathlib.Path(root, rel)
              if not path.exists():
                  missing.append(rel)
              elif path.stat().st_size == 0:
                  empty.append(rel)
          if missing or empty:
              raise SystemExit(f"missing={missing} empty={empty}")
          print("agent library validation passed")
          PY
